services:
  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    depends_on: [db]
    volumes: [private_media:/app/private_media, static:/app/staticfiles]
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application -b 0.0.0.0:8000 --workers 3"
    restart: unless-stopped
  nginx:
    image: nginx:1.27
    depends_on: [web]
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    restart: unless-stopped
volumes: {pgdata: {}, private_media: {}, static: {}}
