{% extends "base_login.html" %}
{% block title %}Entrar · EFSD{% endblock %}
{% block content %}
<form method="post" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>{% endif %}
  <div class="mb-3">
    <label class="form-label" for="{{ form.username.id_for_label }}">Usuário</label>
    {{ form.username }}
  </div>
  <div class="mb-3">
    <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
    {{ form.password }}
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary w-100" type="submit">Entrar</button>
</form>
<p class="text-center mt-3 mb-0 small"><a href="{% url 'accounts:password_reset' %}">Esqueci minha senha</a></p>
{% endblock %}
