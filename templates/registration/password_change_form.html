{% extends "base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Alterar senha</h1>
<form method="post" class="form-estreito">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for campo in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    <input type="password" name="{{ campo.html_name }}" id="{{ campo.id_for_label }}" class="form-control{% if campo.errors %} is-invalid{% endif %}" required>
    {% for e in campo.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
  </div>
  {% endfor %}
  <button class="btn btn-primary" type="submit">Salvar</button>
  <a class="btn btn-outline-secondary" href="{% url 'core:dashboard' %}">Cancelar</a>
</form>
{% endblock %}
